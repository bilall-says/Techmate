    <script>
      // Prevent browser extension conflicts (e.g. MetaMask, Rabby, Coinbase Wallet throwing "Cannot redefine property: ethereum")
      (function() {
        try {
          window.addEventListener('error', function(event) {
            if (event && event.message && event.message.toLowerCase().includes('ethereum')) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reason = event && event.reason ? String(event.reason) : '';
            if (reason.toLowerCase().includes('ethereum')) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(target, prop, descriptor) {
            if (target === window && prop === 'ethereum') {
              try {
                return origDefineProperty.call(Object, target, prop, Object.assign({}, descriptor, {
                  configurable: true,
                  writable: true
                }));
              } catch (e) {
                // If it fails to redefine, safely fallback without throwing fatal TypeError
                try {
                  if (descriptor && 'value' in descriptor) {
                    target.ethereum = descriptor.value;
                  }
                } catch (_) {}
                return target;
              }
            }
            try {
              return origDefineProperty.call(Object, target, prop, descriptor);
            } catch (err) {
              if (prop === 'ethereum') {
                return target;
              }
              throw err;
            }
          };
        } catch (_) {}
      })();
    </script>
